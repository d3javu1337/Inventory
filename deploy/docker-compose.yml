services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-asset_inventory}
      POSTGRES_USER: ${POSTGRES_USER:-asset_inventory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asset_inventory_dev}
    networks:
      - backend
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - backend
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__PostgreSql: Host=postgres;Port=5432;Database=${POSTGRES_DB:-asset_inventory};Username=${POSTGRES_USER:-asset_inventory};Password=${POSTGRES_PASSWORD:-asset_inventory_dev}
      ConnectionStrings__Redis: redis:6379,abortConnect=false,connectTimeout=1000
      Database__ApplyMigrationsOnStartup: "true"
      FileStorage__RootPath: /app/storage
      Seed__AdminLogin: ${ADMIN_LOGIN:-admin}
    ports:
      # HR integration is anonymous and must not be exposed to the LAN/Internet.
      - "127.0.0.1:5147:8080"
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/8080
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          IFS=' ' read -r protocol status reason <&3
          test "$$status" = 200
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 10
    volumes:
      - document-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
  web:
    restart: unless-stopped
    build:
      context: ../web
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend
volumes:
  postgres-data:
  redis-data:
  document-storage:
networks:
  backend:
    name: asset-inventory-backend
    driver: bridge
